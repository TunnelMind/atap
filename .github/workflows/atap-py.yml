name: atap-py

# The Python package's suite, including the byte-equality pin between its packaged verify.sh and the
# repo root's (a10 review, 2026-10-09). The integration test runs against the CLI built here.
on:
  pull_request:
    paths:
      - 'packages/atap-py/**'
      - 'packages/atap-cli/**'
      - 'packages/atap-js/**'
      - 'verify.sh'
      - '.github/workflows/atap-py.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: cd packages/atap-js && npm ci && npm run build
      - run: cd packages/atap-cli && npm ci && npm run build
      - run: cd packages/atap-py && python -m unittest discover -s tests -v
