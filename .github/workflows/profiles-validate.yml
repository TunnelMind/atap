name: profiles-validate

# Runs the folded profiles/ registry checks (ATAP §9.4). GitHub only reads
# workflows from the repo-root .github/workflows, so the copy that came over
# with the subtree at profiles/.github/workflows/validate.yml never runs.
# Keep the steps in step with that file.

on:
  push:
    paths:
      - 'profiles/**'
      - '.github/workflows/profiles-validate.yml'
  pull_request:
    paths:
      - 'profiles/**'
      - '.github/workflows/profiles-validate.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: profiles
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm install
      - name: Validate schemas, examples, and PII rejection (ATAP §9.4 1-2)
        run: npm run validate
      - name: Verify signed example chains round-trip (ATAP §9.4 4)
        run: npm run verify
