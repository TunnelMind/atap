[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "atap"
version = "0.1.0"
description = "Thin Python client of atap-witness: record an agent's work in the project's .atap/ store"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atap = ["verify.sh"]
